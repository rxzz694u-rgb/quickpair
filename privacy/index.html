    <script>
      (function() {
        try {
          var saved = localStorage.getItem('quickpair_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#121214';
            document.documentElement.style.color = '#F3F3F5';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#F7F7F5';
            document.documentElement.style.color = '#111111';
          }
        } catch(e) {}
      })();
    </script>
