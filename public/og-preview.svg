<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFC"/>
      <stop offset="100%" stop-color="#F1F2F6"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1C24"/>
      <stop offset="100%" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="qpBeam" x1="12" y1="24" x2="36" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#FF5B37"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="600" cy="180" r="320" fill="#8B5CF6" opacity="0.06"/>
  <circle cx="780" cy="240" r="260" fill="#FF5B37" opacity="0.06"/>

  <!-- Central Card -->
  <g transform="translate(200, 85)">
    <!-- Main Card Body -->
    <rect width="800" height="460" rx="32" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#softGlow)"/>
    
    <!-- Floating Navbar Simulation -->
    <g transform="translate(48, 40)">
      <!-- Logo Badge -->
      <g transform="translate(0, 0)">
        <rect width="48" height="48" rx="14" fill="url(#logoBg)" stroke="rgba(255,255,255,0.1)"/>
        <!-- Connection Beam -->
        <line x1="13" y1="24" x2="35" y2="24" stroke="#E052D0" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
        <!-- Left Purple Ring & Dot -->
        <circle cx="13" cy="24" r="10.5" stroke="#7952F5" stroke-width="3.2"/>
        <circle cx="13" cy="24" r="3.8" fill="#7952F5"/>
        <!-- Right Coral Ring & Dot -->
        <circle cx="35" cy="24" r="10.5" stroke="#FF5733" stroke-width="3.2"/>
        <circle cx="35" cy="24" r="3.8" fill="#FF5733"/>
        <!-- Center White Dot -->
        <circle cx="24" cy="24" r="2.4" fill="#FFFFFF"/>
      </g>
      
      <!-- Brand Name -->
      <text x="64" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#0B0B0F" letter-spacing="-0.5">Quick<tspan fill="#FF5B37">Pair</tspan></text>
      
      <!-- Active Pill Badge -->
      <g transform="translate(560, 6)">
        <rect width="144" height="36" rx="18" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)"/>
        <circle cx="20" cy="18" r="4.5" fill="#10B981"/>
        <text x="34" y="23" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#059669">2 devices active</text>
      </g>
    </g>
    
    <!-- Headline & Body -->
    <text x="48" y="170" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" fill="#0B0B0F" letter-spacing="-1.2">Instant cross-device <tspan fill="#FF5B37">sharing.</tspan></text>
    <text x="48" y="210" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="18" font-weight="500" fill="#64748B">Send text, links, notes, and files with zero cloud uploads.</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(48, 260)">
      <rect x="0" y="0" width="195" height="46" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0B0B0F">⚡ Sub-5ms Wi-Fi Mesh</text>
      
      <rect x="210" y="0" width="180" height="46" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0B0B0F">🔒 Zero Cloud Uploads</text>
      
      <rect x="405" y="0" width="180" height="46" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="24" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0B0B0F">📱 No App Required</text>
    </g>
    
    <!-- Bottom Footer Meta -->
    <text x="48" y="395" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">P2P Local Wi-Fi Mesh · WebRTC DataChannel · AES-256 E2EE</text>
  </g>
</svg>
