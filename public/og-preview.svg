<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background with subtle warm tint -->
  <rect width="1200" height="630" fill="#F7F7F5"/>
  
  <!-- Subtle background grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E7E7E7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Central App Card Preview -->
  <g transform="translate(250, 95)">
    <!-- Shadow & Card Container -->
    <rect width="700" height="440" rx="28" fill="#FFFFFF" stroke="#E7E7E7" stroke-width="2" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.06))"/>
    
    <!-- Card Header -->
    <g transform="translate(48, 48)">
      <!-- Logo icon -->
      <rect width="40" height="40" rx="10" fill="#111111"/>
      <path d="M9 14C15 9 25 9 31 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M13 19C17 16 23 16 27 19" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="20" cy="26" r="4" fill="#10B981"/>
      
      <!-- Brand Name -->
      <text x="56" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="700" fill="#111111">QuickPair</text>
      
      <!-- Connection Pill -->
      <g transform="translate(470, 4)">
        <rect width="130" height="32" rx="16" fill="#F4F4F2" stroke="#E7E7E7"/>
        <circle cx="20" cy="16" r="4" fill="#10B981"/>
        <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" fill="#111111">2 devices</text>
      </g>
    </g>
    
    <!-- Headline & Body -->
    <text x="48" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#111111" letter-spacing="-1">Share anything.</text>
    <text x="48" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#737373">Move text, links, and files across devices. Instantly.</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(48, 230)">
      <rect x="0" y="0" width="180" height="42" rx="12" fill="#F7F7F5" stroke="#E7E7E7"/>
      <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#111111">⚡ Zero Cloud Uploads</text>
      
      <rect x="195" y="0" width="165" height="42" rx="12" fill="#F7F7F5" stroke="#E7E7E7"/>
      <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#111111">🔒 No Account</text>
      
      <rect x="375" y="0" width="165" height="42" rx="12" fill="#F7F7F5" stroke="#E7E7E7"/>
      <text x="22" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#111111">📱 No App Needed</text>
    </g>
    
    <!-- Bottom subtext -->
    <text x="48" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="500" fill="#8E8E93">● Same Wi-Fi Local P2P &amp; 4G/5G Remote Room Codes</text>
  </g>
</svg>
