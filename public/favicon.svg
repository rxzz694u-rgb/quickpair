<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Connecting Beam -->
  <line
    x1="26"
    y1="50"
    x2="74"
    y2="50"
    stroke="#E052D0"
    stroke-width="7"
    stroke-opacity="0.6"
    stroke-linecap="round"
  />

  <!-- Left Electric Purple Ring -->
  <circle
    cx="26"
    cy="50"
    r="23"
    stroke="#7952F5"
    stroke-width="8"
  />
  <!-- Left Inner Purple Dot -->
  <circle
    cx="26"
    cy="50"
    r="8.5"
    fill="#7952F5"
  />

  <!-- Right Sunset Coral Ring -->
  <circle
    cx="74"
    cy="50"
    r="23"
    stroke="#FF5733"
    stroke-width="8"
  />
  <!-- Right Inner Coral Dot -->
  <circle
    cx="74"
    cy="50"
    r="8.5"
    fill="#FF5733"
  />

  <!-- Center White Intersecting Node -->
  <circle
    cx="50"
    cy="50"
    r="5.5"
    fill="#FFFFFF"
  />
</svg>
